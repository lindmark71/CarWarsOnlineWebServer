<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wars Online — Admin</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            min-height: 100vh;
        }

        /* ── Top Bar ──────────────────────────────────────────────────── */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background-color: #6f42c1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .top-bar-title { font-size: 16px; font-weight: bold; letter-spacing: 1px; }

        .top-bar-actions { display: flex; gap: 10px; }

        .btn-topbar {
            padding: 6px 14px;
            background-color: white;
            color: #6f42c1;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-topbar:hover { background-color: #ede7f6; }

        /* ── Layout ───────────────────────────────────────────────────── */
        .page-content {
            margin-top: 48px;
            padding: 24px;
            max-width: 1100px;
        }

        /* ── Tabs ─────────────────────────────────────────────────────── */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
        }

        .tab-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            background: none;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s;
        }

        .tab-btn:hover { color: #6f42c1; }

        .tab-btn.active {
            color: #6f42c1;
            border-bottom-color: #6f42c1;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Section Header ───────────────────────────────────────────── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        /* ── Buttons ──────────────────────────────────────────────────── */
        .btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary   { background-color: #007bff; color: white; }
        .btn-primary:hover   { background-color: #0056b3; }

        .btn-danger    { background-color: #dc3545; color: white; }
        .btn-danger:hover    { background-color: #b02a37; }

        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #545b62; }

        .btn-sm { padding: 4px 10px; font-size: 12px; }

        /* ── Table ────────────────────────────────────────────────────── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            font-size: 13px;
        }

        .data-table th {
            background-color: #6f42c1;
            color: white;
            padding: 10px 14px;
            text-align: left;
            font-weight: bold;
        }

        .data-table td {
            padding: 9px 14px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background-color: #f8f4ff; }

        /* ── Status Badge ─────────────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-waiting  { background: #fff3cd; color: #856404; }
        .badge-active   { background: #d1e7dd; color: #0f5132; }
        .badge-done     { background: #f8d7da; color: #842029; }
        .badge-public   { background: #d1e7dd; color: #0f5132; }
        .badge-private  { background: #f8d7da; color: #842029; }

        /* ── Status Select ────────────────────────────────────────────── */
        .status-select {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        /* ── Empty State ──────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* ── Loading ──────────────────────────────────────────────────── */
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        /* ── Toast Notification ───────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }
        .toast.success { background: #198754; }
        .toast.error   { background: #dc3545; }

        /* ── Confirm Dialog ───────────────────────────────────────────── */
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }

        .confirm-overlay.active { display: flex; }

        .confirm-box {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 360px;
            text-align: center;
        }

        .confirm-box h3 { margin: 0 0 12px 0; color: #333; }
        .confirm-box p  { margin: 0 0 20px 0; color: #555; font-size: 14px; }

        .confirm-buttons { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-title">⚙ Car Wars Online — Database Admin</div>
        <div class="top-bar-actions">
            <button class="btn-topbar" onclick="refreshCurrentTab()">↻ Refresh</button>
            <button class="btn-topbar" onclick="window.location.href='/login'">← Back to Game</button>
        </div>
    </div>

    <div class="page-content">

        <!-- Tab Bar -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('games')">🎮 Games</button>
            <button class="tab-btn"        onclick="switchTab('players')">👤 Players</button>
            <button class="tab-btn"        onclick="switchTab('designs')">🚗 Designs</button>
            <button class="tab-btn"        onclick="switchTab('maps')">🗺 Maps</button>
        </div>

        <!-- Games Tab -->
        <div class="tab-panel active" id="tab-games">
            <div class="section-header">
                <h2>Games</h2>
            </div>
            <div id="games-content"><div class="loading">Loading...</div></div>
        </div>

        <!-- Players Tab -->
        <div class="tab-panel" id="tab-players">
            <div class="section-header">
                <h2>Game Players</h2>
            </div>
            <div id="players-content"><div class="loading">Loading...</div></div>
        </div>

        <!-- Designs Tab -->
        <div class="tab-panel" id="tab-designs">
            <div class="section-header">
                <h2>Designs</h2>
            </div>
            <div id="designs-content"><div class="loading">Loading...</div></div>
        </div>

        <!-- Maps Tab -->
        <div class="tab-panel" id="tab-maps">
            <div class="section-header">
                <h2>Maps</h2>
            </div>
            <div id="maps-content"><div class="loading">Loading...</div></div>
        </div>

    </div>

    <!-- Confirm Dialog -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <h3 id="confirmTitle">Are you sure?</h3>
            <p  id="confirmMessage"></p>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
                <button class="btn btn-danger"    id="confirmOkBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ── Tab Management ────────────────────────────────────────────────
        let currentTab = 'games';

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', ['games','players','designs','maps'][i] === tab);
            });
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            currentTab = tab;
            loadTab(tab);
        }

        function refreshCurrentTab() { loadTab(currentTab); }

        function loadTab(tab) {
            switch (tab) {
                case 'games':   loadGames();   break;
                case 'players': loadPlayers(); break;
                case 'designs': loadDesigns(); break;
                case 'maps':    loadMaps();    break;
            }
        }

        // ── Toast ─────────────────────────────────────────────────────────
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className   = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        // ── Confirm Dialog ────────────────────────────────────────────────
        function showConfirm(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent   = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmOkBtn').onclick = () => {
                closeConfirm();
                onConfirm();
            };
            document.getElementById('confirmOverlay').classList.add('active');
        }

        function closeConfirm() {
            document.getElementById('confirmOverlay').classList.remove('active');
        }

        // ── Games ─────────────────────────────────────────────────────────
        async function loadGames() {
            const el = document.getElementById('games-content');
            el.innerHTML = '<div class="loading">Loading...</div>';
            try {
                const res   = await fetch('/admin/games');
                const games = await res.json();

                if (!games.length) {
                    el.innerHTML = '<div class="empty-state">No games found.</div>';
                    return;
                }

                el.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Map</th>
                                <th>Players</th>
                                <th>Division</th>
                                <th>Created By</th>
                                <th>Created At</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${games.map(g => `
                                <tr>
                                    <td><strong>${g.name}</strong></td>
                                    <td>${g.map}</td>
                                    <td>${g.max_players}</td>
                                    <td>${Number(g.division).toLocaleString()}</td>
                                    <td>${g.created_by}</td>
                                    <td>${g.created_at ? g.created_at.substring(0,16).replace('T',' ') : ''}</td>
                                    <td>
                                        <select class="status-select"
                                            onchange="updateGameStatus('${g.id}', this.value)">
                                            <option value="waiting" ${g.status==='waiting' ? 'selected' : ''}>Waiting</option>
                                            <option value="active"  ${g.status==='active'  ? 'selected' : ''}>Active</option>
                                            <option value="done"    ${g.status==='done'    ? 'selected' : ''}>Done</option>
                                        </select>
                                    </td>
                                    <td>
                                        <button class="btn btn-danger btn-sm"
                                            onclick="deleteGame('${g.id}', '${g.name}')">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`;
            } catch (e) {
                el.innerHTML = `<div class="empty-state">Error loading games: ${e.message}</div>`;
            }
        }

        async function updateGameStatus(gameId, status) {
            try {
                const res = await fetch(`/admin/games/${gameId}/status`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ status })
                });
                if (res.ok) {
                    showToast('Status updated');
                } else {
                    showToast('Failed to update status', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        function deleteGame(gameId, gameName) {
            showConfirm(
                'Delete Game',
                `Delete "${gameName}" and all its players? This cannot be undone.`,
                async () => {
                    try {
                        const res = await fetch(`/admin/games/${gameId}`, { method: 'DELETE' });
                        if (res.ok) {
                            showToast('Game deleted');
                            loadGames();
                        } else {
                            showToast('Failed to delete game', 'error');
                        }
                    } catch (e) {
                        showToast('Network error', 'error');
                    }
                }
            );
        }

        // ── Players ───────────────────────────────────────────────────────
        async function loadPlayers() {
            const el = document.getElementById('players-content');
            el.innerHTML = '<div class="loading">Loading...</div>';
            try {
                const res     = await fetch('/admin/players');
                const players = await res.json();

                if (!players.length) {
                    el.innerHTML = '<div class="empty-state">No players found.</div>';
                    return;
                }

                el.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Game</th>
                                <th>Username</th>
                                <th>Design</th>
                                <th>Joined At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${players.map(p => `
                                <tr>
                                    <td>${p.game_name || p.game_id}</td>
                                    <td><strong>${p.username}</strong></td>
                                    <td>${p.design || '<em style="color:#aaa">None</em>'}</td>
                                    <td>${p.joined_at ? p.joined_at.substring(0,16).replace('T',' ') : ''}</td>
                                    <td>
                                        <button class="btn btn-danger btn-sm"
                                            onclick="removePlayer('${p.game_id}', '${p.username}')">
                                            Remove
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`;
            } catch (e) {
                el.innerHTML = `<div class="empty-state">Error loading players: ${e.message}</div>`;
            }
        }

        function removePlayer(gameId, username) {
            showConfirm(
                'Remove Player',
                `Remove ${username} from this game?`,
                async () => {
                    try {
                        const res = await fetch(`/admin/players/${gameId}/${username}`,
                                               { method: 'DELETE' });
                        if (res.ok) {
                            showToast('Player removed');
                            loadPlayers();
                        } else {
                            showToast('Failed to remove player', 'error');
                        }
                    } catch (e) {
                        showToast('Network error', 'error');
                    }
                }
            );
        }

        // ── Designs ───────────────────────────────────────────────────────
        async function loadDesigns() {
            const el = document.getElementById('designs-content');
            el.innerHTML = '<div class="loading">Loading...</div>';
            try {
                const res     = await fetch('/admin/designs');
                const designs = await res.json();

                if (!designs.length) {
                    el.innerHTML = '<div class="empty-state">No designs found.</div>';
                    return;
                }

                el.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Owner</th>
                                <th>Uploaded At</th>
                                <th>Visibility</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${designs.map(d => `
                                <tr>
                                    <td><strong>${d.filename}</strong></td>
                                    <td>${d.owner}</td>
                                    <td>${d.uploaded_at ? d.uploaded_at.substring(0,16).replace('T',' ') : ''}</td>
                                    <td>
                                        <span class="badge ${d.is_private ? 'badge-private' : 'badge-public'}">
                                            ${d.is_private ? 'Private' : 'Public'}
                                        </span>
                                    </td>
                                    <td style="display:flex; gap:6px;">
                                        <button class="btn btn-secondary btn-sm"
                                            onclick="toggleDesignPrivacy('${d.id}', ${d.is_private})">
                                            ${d.is_private ? 'Make Public' : 'Make Private'}
                                        </button>
                                        <button class="btn btn-danger btn-sm"
                                            onclick="deleteDesign('${d.id}', '${d.filename}')">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`;
            } catch (e) {
                el.innerHTML = `<div class="empty-state">Error loading designs: ${e.message}</div>`;
            }
        }

        async function toggleDesignPrivacy(designId, currentlyPrivate) {
            try {
                const res = await fetch(`/admin/designs/${designId}/privacy`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ is_private: !currentlyPrivate })
                });
                if (res.ok) {
                    showToast('Visibility updated');
                    loadDesigns();
                } else {
                    showToast('Failed to update visibility', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        function deleteDesign(designId, filename) {
            showConfirm(
                'Delete Design',
                `Delete "${filename}"? This will remove the file and database record.`,
                async () => {
                    try {
                        const res = await fetch(`/admin/designs/${designId}`,
                                               { method: 'DELETE' });
                        if (res.ok) {
                            showToast('Design deleted');
                            loadDesigns();
                        } else {
                            showToast('Failed to delete design', 'error');
                        }
                    } catch (e) {
                        showToast('Network error', 'error');
                    }
                }
            );
        }

        // ── Maps ──────────────────────────────────────────────────────────
        async function loadMaps() {
            const el = document.getElementById('maps-content');
            el.innerHTML = '<div class="loading">Loading...</div>';
            try {
                const res  = await fetch('/admin/maps');
                const maps = await res.json();

                if (!maps.length) {
                    el.innerHTML = '<div class="empty-state">No maps found.</div>';
                    return;
                }

                el.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Uploaded By</th>
                                <th>Uploaded At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${maps.map(m => `
                                <tr>
                                    <td><strong>${m.filename}</strong></td>
                                    <td>${m.uploaded_by}</td>
                                    <td>${m.uploaded_at ? m.uploaded_at.substring(0,16).replace('T',' ') : ''}</td>
                                    <td>
                                        <button class="btn btn-danger btn-sm"
                                            onclick="deleteMap('${m.id}', '${m.filename}')">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`;
            } catch (e) {
                el.innerHTML = `<div class="empty-state">Error loading maps: ${e.message}</div>`;
            }
        }

        function deleteMap(mapId, filename) {
            showConfirm(
                'Delete Map',
                `Delete "${filename}"? This will remove the file and database record.`,
                async () => {
                    try {
                        const res = await fetch(`/admin/maps/${mapId}`,
                                               { method: 'DELETE' });
                        if (res.ok) {
                            showToast('Map deleted');
                            loadMaps();
                        } else {
                            showToast('Failed to delete map', 'error');
                        }
                    } catch (e) {
                        showToast('Network error', 'error');
                    }
                }
            );
        }

        // ── Initialise ────────────────────────────────────────────────────
        loadGames();
    </script>

</body>
</html>
