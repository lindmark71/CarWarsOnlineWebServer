<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Server Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h2 { margin-bottom: 20px; text-align: center; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007BFF; border: none; color: white; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 14px; text-align: center; }
        .register-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .register-link a { color: #007BFF; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }

        /* ── Password Visibility Toggle ───────────────────────────────── */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input[type="password"],
        .password-wrapper input[type="text"] {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            color: #888;
            user-select: none;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover { color: #333; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Car Wars Online Login</h2>
    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>

        <div class="password-wrapper">
            <input type="password" name="password" id="loginPassword" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁</button>
        </div>

        <button type="submit">Log In</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="register-link">
        <p>Don't have an account? <a href="/register">Create one</a></p>
    </div>
</div>

<script>
    function togglePassword(fieldId, button) {
        const field = document.getElementById(fieldId);
        if (field.type === 'password') {
            field.type = 'text';
            button.textContent = '🙈';
        } else {
            field.type = 'password';
            button.textContent = '👁';
        }
    }
</script>

</body>
</html>
